[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "korrel"
version = "0.1.0"
description = "OSS Python SDK for agent simulation: define a multi-turn agent test once, run it as a pytest CI gate, export it as a verifiers/OpenEnv RL environment."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "korrel-dev" }]
dependencies = [
    "pydantic>=2,<3",
    "anthropic",
]

[project.optional-dependencies]
openai = ["openai"]
verifiers = ["verifiers>=0.1.14"]

[project.scripts]
korrel = "korrel.cli:main"

[project.entry-points.pytest11]
korrel = "korrel.pytest_plugin"

[project.urls]
Homepage = "https://github.com/korrel-dev/korrel"

[dependency-groups]
dev = ["pytest"]

[tool.hatch.build.targets.wheel]
packages = ["src/korrel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    # MockTool.schema is part of the public surface (chat-completions tool shape);
    # the field name intentionally shadows the deprecated BaseModel.schema method.
    'ignore:Field name "schema".*:UserWarning',
]
