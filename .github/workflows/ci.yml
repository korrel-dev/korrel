name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v6.0.3

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync

      - name: Run tests
        run: uv run pytest

  verifiers-export:
    name: verifiers-export (Python 3.13)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6.0.3

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          python-version: "3.13"

      - name: Install dependencies with verifiers extra
        run: uv sync --extra verifiers

      - name: Run tests
        run: uv run pytest

  openenv-export:
    name: openenv-export (Python 3.13)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6.0.3

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          python-version: "3.13"

      - name: Install dependencies with openenv extra
        run: uv sync --extra openenv

      - name: Run tests
        run: uv run pytest

  # Reproduces the tau2 fidelity benchmark offline. Installing the benchmarks
  # uv project git-fetches the pinned tau2; no ANTHROPIC_API_KEY is set and the
  # benchmark itself makes no network or LLM call.
  benchmark:
    name: benchmark (Python 3.13)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6.0.3

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          python-version: "3.13"

      # run.py performs the uv sync itself (its first step), so no explicit
      # sync step is needed; the system Python only orchestrates subprocesses.
      - name: Run the fidelity benchmark (offline, no keys)
        working-directory: benchmarks
        run: python run.py

      - name: Assert the reproduced result is 80/80 with 0 verdict flips
        working-directory: benchmarks
        run: |
          python - <<'EOF'
          import json
          data = json.load(open("results/results.json", encoding="utf-8"))
          assert data["n_total"] == 80, f"expected 80 runs, got {data['n_total']}"
          assert data["n_pass"] == 80, f"expected 80 passes, got {data['n_pass']}"
          flips = sum(r["flip_count"] for r in data["runs"])
          assert flips == 0, f"expected 0 verdict flips, got {flips}"
          print("benchmark reproduced: 80/80, 0 verdict flips")
          EOF
