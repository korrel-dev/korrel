[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "korrel"
version = "0.1.0"
description = "OSS Python SDK for agent simulation: define a multi-turn agent test once, run it as a pytest CI gate, export it as a verifiers/OpenEnv RL environment."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "korrel-dev" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Testing",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
keywords = [
    "agent", "evaluation", "simulation", "llm",
    "reinforcement-learning", "pytest", "verifiers", "openenv",
]
dependencies = [
    "pydantic>=2,<3",
    "anthropic",
]

[project.optional-dependencies]
openai = ["openai"]
verifiers = ["verifiers>=0.1.14"]
openenv = ["openenv-core>=0.3.0"]

[project.scripts]
korrel = "korrel.cli:main"

[project.entry-points.pytest11]
korrel = "korrel.pytest_plugin"

[project.urls]
Homepage = "https://korrel.dev"
Repository = "https://github.com/korrel-dev/korrel"
Documentation = "https://github.com/korrel-dev/korrel#readme"
Issues = "https://github.com/korrel-dev/korrel/issues"

[dependency-groups]
dev = ["pytest"]

[tool.hatch.build.targets.wheel]
packages = ["src/korrel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    # MockTool.schema is part of the public surface (chat-completions tool shape);
    # the field name intentionally shadows the deprecated BaseModel.schema method.
    'ignore:Field name "schema".*:UserWarning',
]
